trainer: default

dataset:
  train:
    format: ase_db
    src:
      - /path/to/train/dataset
    a2g_args: { r_energy: True, r_forces: True, r_stress: True }

  val:
    format: ase_db
    src:
      - /path/to/valid/dataset
    a2g_args: { r_energy: True, r_forces: True, r_stress: True }

evaluation_metrics:
  metrics:
    energy:
      - mae
      - per_atom_mae
    forces:
      - mae
    stress:
      - mae
  primary_metric: forces_mae
hide_eval_progressbar: true
loss_functions:
  - energy:
      coefficient: 1
      fn: per_atom_mae
  - forces:
      coefficient: 1
      fn: l2mae
  - stress:
      coefficient: 1
      fn: voigt6mae

model:
  name: equflashv2_comp

  #Edge Embedding
  cutoff: 6.0
  cutoff_function:
    cutoff_function_name: XPLOR
    cutoff_on: 5.5
  radial_basis:
    bessel_basis_num: 8
    radial_basis_name: bessel
    trainable_coeff: False

  # Layer  irreps
  irreps_manual:
    - 128x0e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e+128x1o+128x2e+128x3o+128x4e
    - 128x0e
  is_parity: true
  lmax: 4

  otf_graph: True
  use_pbc: True
  max_neighbors: 2000000

  ## Interaction Blocks
  interaction_type: equflash # equflash or nequip
  interaction_kwargs:
    sc_type: identity # identity or linear
    conv_type: full # full or efficient
    conv_kwargs:
      weight_nn_layers:
        - 64
        - 64
      denominator: 72.481
      train_denominator: false
    nonlinear_type: bilinear_gate # gate or bilinear_gate or symmetric_contraction
    nonlinear_kwargs:
      irreps_scale: 1
      after_nonlinear: "linear" #linear or identity

  ## FeedForward Blocks
  feedforward_type: feedforward # feedforward or identity
  feedforward_kwargs:
    nonlinear_type: bilinear_gate # gate or bilinear_gate or symmetric_contraction
    nonlinear_kwargs:
      irreps_scale: 1

