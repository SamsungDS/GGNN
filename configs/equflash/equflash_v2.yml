optim:
  max_atoms: 1000
  ema_decay: 0.999
  batch_size: 16
  eval_batch_size: 64

  num_workers: 8
  max_epochs: 1
  start_factor: 1.0
  end_factor: 0.0
  total_iters: "max_epochs"
  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001
  lr_initial: 0.005
  max_lr: 0.005
  eval_every: 25000
  pct_start: 0.01
  scheduler: OneCycleLR
  # If want to use muon, enable below
  # muon : True
  # muon_params:
  #   adjust_lr_fn : match_rms_adamw
outputs:
  energy:
    level: system
    shape: 1
  forces:
    eval_on_free_atoms: true
    irrep_dim: 1
    level: atom
    train_on_free_atoms: true
  stress:
    level: system
    property: stress
