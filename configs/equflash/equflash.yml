optim:
  anneal_strategy: cos
  batch_size: 16
  checkpoint_every: -1
  clip_grad_norm: 100
  eval_batch_size: 16
  lr_initial: 0.001
  max_epochs: 1000
  max_lr: 0.001
  num_workers: 8
  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001
  pct_start: 0.00125
  scheduler: OneCycleLR
  total_iters: max_epochs
outputs:
  energy:
    level: system
    shape: 1
  forces:
    eval_on_free_atoms: true
    irrep_dim: 1
    level: atom
    train_on_free_atoms: true
  stress:
    level: system
    property: stress
slurm: {}
task:
