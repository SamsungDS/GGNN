amp: false
dataset:
  train:
    a2g_args:
      r_energy: true
      r_forces: true
      r_stress: true
    format: ase_db
    src:
    - /path/to/train/dataset
  val:
    a2g_args:
      r_energy: true
      r_forces: true
      r_stress: true
    format: ase_db
    src:
    - /path/to/valid/dataset
evaluation_metrics:
  metrics:
    energy:
    - mae
    - per_atom_mae
    forces:
    - mae
    stress:
    - mae
  primary_metric: forces_mae
gp_gpus: null
gpus: 4
logger: files
loss_functions:
- energy:
    coefficient: 1
    fn: per_atom_mae
- forces:
    coefficient: 1
    fn: l2mae
- stress:
    coefficient: 0.01
    fn: voigt6mae
model:
  act_gate:
    e: silu
    o: tanh
  act_scalar:
    e: silu
    o: tanh
  channel: 256
  conv_denominator: 72.48148148148148
  cutoff: 6.0
  cutoff_function:
    cutoff_function_name: XPLOR
    cutoff_on: 5.5
  irreps_manual:
  - 256x0e
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e+256x1o+256x2e+256x3o
  - 256x0e
  is_parity: true
  lmax: 3
  max_neighbors: 2000000
  name: equflash
  num_convolution_layer: 10
  otf_graph: true
  radial_basis:
    bessel_basis_num: 8
    radial_basis_name: bessel
  self_connection_type: linear
  train_denominator: false
  train_shift_scale: false
  use_pbc: true
